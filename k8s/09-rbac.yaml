---
# Role for fintech-app service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fintech-app-role
  namespace: fintech
rules:
# Permissions for reading config and secrets
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
# Permissions for reading pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Permissions for managing events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Permissions for service discovery
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding for fintech-app service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fintech-app-rolebinding
  namespace: fintech
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fintech-app-role
subjects:
- kind: ServiceAccount
  name: fintech-app
  namespace: fintech

---
# ClusterRole for viewing cluster-wide resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fintech-monitoring-role
rules:
# Permissions for monitoring
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fintech-monitoring-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fintech-monitoring-role
subjects:
- kind: ServiceAccount
  name: fintech-app
  namespace: fintech
